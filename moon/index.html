<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Year — Poster Lab</title>
<link rel="stylesheet" href="../shared.css">
<style>.field { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; color: var(--mute); } .field input { width: 100%; margin: 0; }</style>
</head>
<body>
<header><h1><a href="../">Poster Lab</a> / Moon Year</h1><span>every night of a year, as the moon looked</span></header>
<main>
  <div class="stage"><canvas id="sheet"></canvas></div>
  <aside>
    <section><h2>Year</h2>
      <div class="field"><span>Year</span><input id="year" type="number" min="1901" max="2199"></div>
      <div class="field"><span>Mark a day</span><input id="mark" type="date"></div>
      <input id="name" type="text" placeholder="Title (defaults to the year)" maxlength="30" style="margin-top:6px">
    </section>
    <section><h2>Palette</h2><div id="themes"></div></section>
    <section class="actions"><h2>Sheet</h2>
      <div class="row">
        <select id="size"><option value="2">PNG 2000×2828</option><option value="3" selected>PNG 3000×4242</option><option value="5">PNG 5000×7070</option></select>
        <button id="download" class="primary">Download</button>
        <button id="copy">Copy link</button>
      </div>
      <p class="hint">Full moons are drawn in the accent colour. Lit side is as seen from the northern hemisphere.</p>
    </section>
  </aside>
</main>
<script type="module" src="moon.js"></script>
</body>
</html>
