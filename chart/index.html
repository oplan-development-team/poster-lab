<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birth Chart — Poster Lab</title>
<link rel="stylesheet" href="../shared.css">
<style>
  .field { display: grid; grid-template-columns: 80px 1fr; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; color: var(--mute); }
  .field input { width: 100%; margin: 0; }
  .err { border-color: #d64545 !important; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }
</style>
</head>
<body>
<header><h1><a href="../">Poster Lab</a> / Birth Chart</h1><span>where the planets stood when you arrived</span></header>
<main>
  <div class="stage"><canvas id="sheet"></canvas></div>
  <aside>
    <section><h2>Who</h2><input id="name" type="text" placeholder="Name (title)" maxlength="30"></section>
    <section><h2>When</h2>
      <div class="field"><span>Date</span><input id="date" type="date"></div>
      <div class="field"><span>Local time</span><input id="time" type="time"></div>
    </section>
    <section><h2>Where</h2>
      <div class="row"><input id="place" type="text" placeholder="City or place" style="flex:1;margin:0"><button id="search">Search</button></div>
      <div class="field"><span>Latitude</span><input id="lat" type="number" step="0.0001" min="-90" max="90"></div>
      <div class="field"><span>Longitude</span><input id="lng" type="number" step="0.0001" min="-180" max="180"></div>
    </section>
    <section><h2>Wheel</h2><label class="chk"><input id="aspects" type="checkbox"> Aspect lines</label></section>
    <section><h2>Palette</h2><div id="themes"></div></section>
    <section class="actions"><h2>Sheet</h2>
      <div class="row">
        <select id="size"><option value="2">PNG 2000px</option><option value="3" selected>PNG 3000px (A3 @ 300dpi-ish)</option><option value="5">PNG 5000px</option></select>
        <button id="download" class="primary">Download</button>
        <button id="copy">Copy link</button>
      </div>
      <p class="hint">Tropical zodiac, equal houses from the ascendant. Positions good to about a degree — a poster, not an almanac.</p>
    </section>
  </aside>
</main>
<script type="module" src="chart.js"></script>
</body>
</html>
